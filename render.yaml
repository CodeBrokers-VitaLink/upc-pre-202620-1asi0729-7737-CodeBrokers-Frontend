services:
  - type: web
    name: vitalink-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/vitalink-frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
